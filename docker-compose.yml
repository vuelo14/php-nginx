name: php-nginx

services:
  # Service Utama: PHP 8.3 + Nginx + Worker (All-in-One Container sebagai user www-data)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Ganti dengan nama image GHCR Anda setelah dibuild oleh GitHub Actions:
    # image: ghcr.io/<github-username>/php-nginx:latest
    container_name: php_nginx_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      # Default ke /var/www/html/public (Laravel). Ubah ke /var/www/html jika PHP biasa.
      - DOCUMENT_ROOT=/var/www/html/public

      # --- Fitur Queue Worker & Scheduler Laravel dalam Satu Container ---
      # Set true jika ingin menjalankan queue worker otomatis di background:
      - ENABLE_WORKER=false
      # Perintah worker yang dijalankan (default: php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600)
      - WORKER_COMMAND=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
      - WORKER_NUMPROCS=1

      # Set true jika ingin menjalankan scheduler cron Laravel otomatis:
      - ENABLE_SCHEDULER=false
    volumes:
      - ./:/var/www/html
      # Uncomment jika ingin live-reload konfigurasi Nginx lokal:
      # - ./docker/nginx/default.conf:/etc/nginx/http.d/default.conf
      # Uncomment jika ingin menambahkan konfigurasi supervisor kustom:
      # - ./docker/supervisor/conf.d:/etc/supervisor/conf.d
    networks:
      - app_network

  # Service Cache & Queue (Redis)
  redis:
    image: redis:7-alpine
    container_name: php_nginx_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
    # Jika ingin menghubungkan ke network database eksternal yang sudah ada:
    # external: true
    # name: db
